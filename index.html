<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>LKPD Fisika SMA - Computational Thinking</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 800px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        /* Area Simulasi HP */
        #simulation-stage { 
            height: 200px; border: 2px solid #e2e8f0; border-radius: 8px; 
            position: relative; overflow: hidden; background: #fff; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: space-around;
        }
        .phone { font-size: 50px; position: relative; z-index: 2; transition: 0.3s; }
        .wave { 
            position: absolute; border: 2px solid var(--primary); border-radius: 50%; 
            animation: ripple 2s infinite linear; opacity: 0; 
        }
        @keyframes ripple {
            0% { width: 0; height: 0; opacity: 0.5; }
            100% { width: 500px; height: 500px; opacity: 0; }
        }

        /* Drag and Drop Style */
        .drop-zone { 
            width: 150px; height: 100px; border: 2px dashed #cbd5e1; 
            display: flex; align-items: center; justify-content: center; border-radius: 8px;
        }
        .media-container { display: flex; gap: 10px; margin-top: 20px; }
        .draggable { 
            padding: 10px; background: #3b82f6; color: white; cursor: grab; 
            border-radius: 4px; font-size: 14px; 
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .result-panel { 
            margin-top: 20px; padding: 15px; background: #eff6ff; 
            border-left: 4px solid var(--primary); font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📱 Analisis Frekuensi & Material (SMA)</h2>
    
    <div id="simulation-stage">
        <div id="drop-area" class="drop-zone">Tarik Media Ke Sini</div>
        <div class="phone" id="phoneIcon">📱</div>
        <div id="waves-container"></div>
    </div>

    <p><strong>Pilih Media (Drag ke zona putus-putus):</strong></p>
    <div class="media-container">
        <div class="draggable" draggable="true" ondragstart="drag(event)" id="busa" data-effect="0.2">Busa Akustik (Padat)</div>
        <div class="draggable" draggable="true" ondragstart="drag(event)" id="kayu" data-effect="0.6">Papan Kayu (Padat)</div>
        <div class="draggable" draggable="true" ondragstart="drag(event)" id="casing" data-effect="1">Warna Casing (Abaikan)</div>
    </div>

    <div class="controls">
        <div>
            <label>Frekuensi Sumber ($f_s$): <span id="f_val">440</span> Hz</label>
            <input type="range" id="freqSlider" min="200" max="1000" value="440" style="width:100%">
        </div>
        <div>
            <label>Kecepatan HP ($v_s$): <span id="v_val">0</span> m/s</label>
            <input type="range" id="velSlider" min="0" max="100" value="0" style="width:100%">
        </div>
    </div>

    <div class="result-panel">
        Output Frekuensi Terdeteksi ($f_p$): <span id="fp_result">440</span> Hz <br>
        <small id="analysisText">Status: Bunyi merambat normal di udara.</small>
    </div>
</div>

<script>
    const wavesCont = document.getElementById('waves-container');
    const fpResult = document.getElementById('fp_result');
    let currentEffect = 1;

    // Fungsi Doppler & Update UI
    function updateSim() {
        const fs = parseFloat(document.getElementById('freqSlider').value);
        const vs = parseFloat(document.getElementById('velSlider').value);
        const v = 340; // Kecepatan Bunyi

        // Algoritma Efek Doppler
        let fp = fs * (v / (v - vs));
        
        // Abstraksi: Pengaruh Media
        let finalFp = fp * currentEffect;

        document.getElementById('f_val').innerText = fs;
        document.getElementById('v_val').innerText = vs;
        fpResult.innerText = finalFp.toFixed(2);

        // Animasi Gelombang (Visualisasi Frekuensi)
        wavesCont.innerHTML = '';
        const wave = document.createElement('div');
        wave.className = 'wave';
        // Semakin tinggi frekuensi, semakin cepat animasi
        wave.style.animationDuration = (1000 / finalFp) + 's';
        wavesCont.appendChild(wave);
    }

    // Drag & Drop Logic
    function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
    
    document.getElementById('drop-area').ondragover = (e) => e.preventDefault();
    document.getElementById('drop-area').ondrop = (e) => {
        e.preventDefault();
        const id = e.dataTransfer.getData("text");
        const el = document.getElementById(id);
        currentEffect = parseFloat(el.getAttribute('data-effect'));
        
        e.target.innerText = el.innerText;
        document.getElementById('analysisText').innerText = 
            currentEffect < 1 ? "Analisis: Media ini MEMPENGARUHI intensitas/frekuensi." : "Analisis: Variabel ini TIDAK RELEVAN (Abstraksi).";
        updateSim();
    };

    document.getElementById('freqSlider').oninput = updateSim;
    document.getElementById('velSlider').oninput = updateSim;
    updateSim();
</script>

</body>
    </html>
