<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Lab Akustik SMA - Computational Thinking</title>
    <style>
        :root { --main: #2563eb; --accent: #10b981; --dark: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .app-container { background: white; max-width: 900px; width: 100%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; }
        
        /* Visual Display */
        .screen { background: #0f172a; border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: center; color: white; border: 4px solid #334155; }
        canvas { width: 100%; height: 150px; }
        
        .stage { display: flex; justify-content: space-around; align-items: center; padding: 20px; border: 2px dashed #cbd5e1; border-radius: 12px; margin-bottom: 20px; }
        .device { font-size: 60px; transition: transform 0.1s; }
        
        /* Controls */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .control-item { display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #475569; }
        
        /* Drag n Drop */
        .inventory { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .item { padding: 8px 15px; background: var(--main); color: white; border-radius: 20px; cursor: grab; font-size: 13px; }
        .drop-zone { width: 150px; height: 100px; border: 3px dotted #94a3b8; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; background: #f8fafc; }

        /* Audio Button */
        #audioBtn { width: 100%; padding: 15px; border: none; border-radius: 8px; background: var(--accent); color: white; font-weight: bold; cursor: pointer; margin-bottom: 15px; font-size: 16px; }
        #audioBtn.active { background: #ef4444; }

        .data-panel { background: #f8fafc; border-radius: 8px; padding: 15px; font-size: 14px; border-left: 5px solid var(--main); }
        .highlight { color: var(--main); font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <h2 style="text-align:center; color: var(--dark);">🔬 Lab Akustik Digital (Level SMA)</h2>
    
    <button id="audioBtn">▶ AKTIFKAN AUDIO EKSPERIMEN</button>

    <div class="screen">
        <canvas id="waveCanvas"></canvas>
        <div style="font-size: 12px; margin-top: 5px; color: #94a3b8;">Oscilloscope Visualizer</div>
    </div>

    <div class="stage">
        <div id="dropZone" class="drop-zone">Tarik Material Ke Sini (Absorpsi)</div>
        <div class="device" id="phone">📱</div>
    </div>

    <div class="inventory">
        <div class="item" draggable="true" id="busa" data-alpha="0.2">Busa Akustik (α=0.8)</div>
        <div class="item" draggable="true" id="kayu" data-alpha="0.7">Papan Kayu (α=0.3)</div>
        <div class="item" draggable="true" id="harga" data-alpha="1">Harga HP (Abstraksi)</div>
    </div>

    <div class="controls">
        <div class="control-item">
            <label>Frekuensi ($f$): <span class="highlight" id="fVal">440</span> Hz</label>
            <input type="range" id="fSlider" min="100" max="1200" value="440">
        </div>
        <div class="control-item">
            <label>Kecepatan Sumber ($v_s$): <span class="highlight" id="vVal">0</span> m/s</label>
            <input type="range" id="vSlider" min="0" max="150" value="0">
        </div>
    </div>

    <div class="data-panel">
        <strong>Analisis Data Fisika:</strong><br>
        • Taraf Intensitas Terdeteksi: <span class="highlight" id="dbRes">60.0</span> dB<br>
        • Frekuensi Doppler ($f_p$): <span class="highlight" id="dopplerRes">440</span> Hz<br>
        • Status: <span id="status">Normal</span>
    </div>
</div>

<script>
    // Audio API Setup
    let audioCtx, oscillator, gainNode;
    let isPlaying = false;

    // Canvas Setup
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    let animationId;

    // Variables
    let alpha = 1; 
    const v_sound = 340;

    const audioBtn = document.getElementById('audioBtn');
    const fSlider = document.getElementById('fSlider');
    const vSlider = document.getElementById('vSlider');

    // 1. Fungsi Inisialisasi Audio
    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        oscillator = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    }

    // 2. Fungsi Utama Update Eksperimen
    function updateAll() {
        const fs = parseFloat(fSlider.value);
        const vs = parseFloat(vSlider.value);
        
        // Algoritma Efek Doppler (Mendekat)
        let fp = fs * (v_sound / (v_sound - vs));
        
        // Taraf Intensitas (Simulasi Sederhana berbasis absorpsi alpha)
        let ti = 60 * alpha;

        // Update UI
        document.getElementById('fVal').innerText = fs;
        document.getElementById('vVal').innerText = vs;
        document.getElementById('dopplerRes').innerText = fp.toFixed(1);
        document.getElementById('dbRes').innerText = ti.toFixed(1);

        // Update Suara Real-time
        if (isPlaying && audioCtx) {
            oscillator.frequency.setTargetAtTime(fp, audioCtx.currentTime, 0.05);
            gainNode.gain.setTargetAtTime(alpha * 0.2, audioCtx.currentTime, 0.05);
        }

        // Animasi HP Bergetar jika kecepatan tinggi
        document.getElementById('phone').style.transform = `scale(${1 + vs/500})`;
    }

    // 3. Visualisasi Oscilloscope
    let offset = 0;
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.strokeStyle = '#22d3ee';
        ctx.lineWidth = 3;

        const freq = parseFloat(fSlider.value);
        const vs = parseFloat(vSlider.value);
        const fp = freq * (v_sound / (v_sound - vs));

        for (let x = 0; x < canvas.width; x++) {
            const y = (canvas.height / 2) + (30 * alpha) * Math.sin((x + offset) * (fp / 500));
            ctx.lineTo(x, y);
        }
        ctx.stroke();
        offset += (fp / 100); 
        animationId = requestAnimationFrame(animate);
    }

    // Event Listeners
    audioBtn.addEventListener('click', () => {
        if (!isPlaying) {
            if (!audioCtx) initAudio();
            gainNode.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.1);
            audioBtn.innerText = "■ MATIKAN AUDIO";
            audioBtn.classList.add('active');
            isPlaying = true;
        } else {
            gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
            audioBtn.innerText = "▶ AKTIFKAN AUDIO EKSPERIMEN";
            audioBtn.classList.remove('active');
            isPlaying = false;
        }
    });

    // Drag and Drop Logic
    document.querySelectorAll('.item').forEach(item => {
        item.ondragstart = (e) => e.dataTransfer.setData("id", e.target.id);
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.ondragover = (e) => e.preventDefault();
    dropZone.ondrop = (e) => {
        const id = e.dataTransfer.getData("id");
        const el = document.getElementById(id);
        alpha = parseFloat(el.getAttribute('data-alpha'));
        dropZone.innerText = "Media: " + el.innerText;
        document.getElementById('status').innerText = alpha < 1 ? "Terjadi Redaman Energi" : "Variabel Abstraksi (Diabaikan)";
        updateAll();
    };

    fSlider.oninput = updateAll;
    vSlider.oninput = updateAll;

    updateAll();
    animate();
</script>

</body>
</html>
